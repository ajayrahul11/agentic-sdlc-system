[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-orchestrator"
version = "0.1.0"
description = "Agentic SDLC orchestrator: a gated LangGraph workflow that turns a requirement into a tested, released service."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langsmith>=0.2",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0.1",
    "rich>=13.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sdlc-orchestrator = "sdlc_orchestrator.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
